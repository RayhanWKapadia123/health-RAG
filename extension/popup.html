<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indiana Healthcare Intelligence</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <header>
      <div class="header-logo">🏥</div>
      <div class="header-text">
        <h1>Indiana Health RAG</h1>
        <span id="status-badge" class="badge badge--connecting">Connecting…</span>
      </div>
      <button id="clear-btn" title="Clear conversation">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>
    </header>

    <div id="messages">
      <div id="empty-state">
        <p class="empty-title">Ask about Indiana health</p>
        <p class="empty-sub">Powered by your local knowledge base</p>
        <div id="suggestions"></div>
      </div>
    </div>

    <div id="followups-bar" class="hidden">
      <p class="followup-label">You might also ask</p>
      <div id="followup-chips"></div>
    </div>

    <footer>
      <div id="input-row">
        <textarea
          id="question-input"
          placeholder="Ask about Indiana healthcare…"
          rows="1"
          maxlength="1000"
        ></textarea>
        <button id="send-btn" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
